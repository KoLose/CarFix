services:
  db:
    image: postgres:16-alpine
    container_name: carfix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: carfixdb
    ports:
      - "5433:5432"
    volumes:
      - carfix_pgdata:/var/lib/postgresql/data
      - ./Infastructure/Sql/carfix_seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carfixdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Avalonia GUI via noVNC (browser: http://localhost:6080)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carfix-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=carfixdb;Username=postgres;Password=123"
      DISPLAY: ":1"
    ports:
      - "6080:6080"
    restart: unless-stopped

volumes:
  carfix_pgdata:
